<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday, Tiara Gayatri 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 40%, #4a2c7a 100%);
    font-family: 'Poppins', sans-serif;
    color: #fff;
    position: relative;
    padding: 40px 0 60px;
  }

  #fxLayer {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
    box-shadow: 0 0 6px #fff, 0 0 12px #ffd6f5;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .2; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .shooting {
    position: absolute;
    width: 3px; height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 12px 3px #fff;
    animation: shoot 2s linear forwards;
  }
  .shooting::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 140px; height: 3px;
    background: linear-gradient(90deg, #fff, transparent);
    transform: translateX(-140px);
    border-radius: 3px;
  }
  @keyframes shoot {
    0% { transform: translate(0,0) rotate(35deg); opacity: 1; }
    100% { transform: translate(700px, 500px) rotate(35deg); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 20px;
    max-width: 820px;
    margin: 0 auto;
  }

  .title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.8rem, 9vw, 5.5rem);
    background: linear-gradient(90deg, #ff9ecb, #ffd6f5, #c9a7ff, #9ecbff, #ff9ecb);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite, floatText 3s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(255,158,203,.4);
    margin-bottom: 5px;
    line-height: 1.1;
  }
  @keyframes shine { to { background-position: 300% 0; } }
  @keyframes floatText {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: clamp(.85rem, 2.5vw, 1.3rem);
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #e0c9ff;
    margin-bottom: 25px;
    opacity: 0;
    animation: fadeUp 1.5s ease forwards .8s;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* KUE */
  .cake-wrap {
    display: inline-block;
    cursor: pointer;
    margin: 20px 0;
    transition: transform .3s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    z-index: 10;
  }
  .cake-wrap:hover { transform: scale(1.06); }
  .cake-wrap:active { transform: scale(.97); }
  .cake-wrap.blown { animation: bounceCake .6s ease; }
  @keyframes bounceCake {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  .cake { position: relative; width: 200px; height: 170px; margin: 0 auto; pointer-events: none; }
  .plate {
    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 16px; border-radius: 50%;
    background: linear-gradient(180deg, #f5e6ff, #b98cd9);
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .layer {
    position: absolute; left: 50%; transform: translateX(-50%);
    border-radius: 12px 12px 8px 8px;
    box-shadow: inset 0 -8px 12px rgba(0,0,0,.15), 0 4px 10px rgba(0,0,0,.3);
  }
  .layer1 { bottom: 14px; width: 190px; height: 65px; background: linear-gradient(180deg, #ff9ecb, #ff6fb0); }
  .layer2 { bottom: 75px; width: 150px; height: 55px; background: linear-gradient(180deg, #c9a7ff, #a678f0); }
  .layer3 { bottom: 126px; width: 110px; height: 40px; background: linear-gradient(180deg, #9ecbff, #6fa8ff); }
  .drip { position: absolute; bottom: 0; left: 0; right: 0; height: 14px; background: #fff5fb; border-radius: 12px 12px 50% 50%; }

  .candle {
    position: absolute; bottom: 166px; left: 50%; transform: translateX(-50%);
    width: 12px; height: 45px;
    background: repeating-linear-gradient(45deg, #fff 0 6px, #ff6fb0 6px 12px);
    border-radius: 3px;
  }
  .wick { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 2px; height: 6px; background: #333; }
  .flame {
    position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
    width: 16px; height: 26px;
    background: radial-gradient(circle at 50% 80%, #fff 0%, #ffd166 30%, #ff8c42 60%, #ff4d00 90%);
    border-radius: 50% 50% 20% 20%;
    box-shadow: 0 0 20px #ffb347, 0 0 40px #ff8c42, 0 0 60px rgba(255,140,66,.5);
    animation: flicker .25s infinite alternate;
    transform-origin: bottom center;
    transition: opacity .4s, transform .4s;
  }
  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
    100% { transform: translateX(-50%) scale(1.1) rotate(2deg); }
  }
  .glow {
    position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,180,80,.4) 0%, transparent 70%);
    animation: pulseGlow 1.5s infinite ease-in-out;
    transition: opacity .5s;
  }
  @keyframes pulseGlow {
    0%,100% { opacity: .7; }
    50% { opacity: 1; }
  }

  .smoke {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(220,220,220,.7);
    pointer-events: none;
  }

  .hint {
    font-size: 1rem;
    color: #e0c9ff;
    margin-top: 5px;
    letter-spacing: 1px;
    animation: pulseHint 2s infinite;
    transition: opacity .5s;
  }
  @keyframes pulseHint {
    0%,100% { opacity: .5; }
    50% { opacity: 1; }
  }

  /* Kotak ucapan */
  .message-box {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1s ease, transform 1s ease;
    pointer-events: none;
    margin-top: 30px;
    padding: 40px 30px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1);
    text-align: left;
  }
  .message-box.show { opacity: 1; transform: translateY(0); }

  .message-box h2 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(1.8rem, 5.5vw, 3rem);
    background: linear-gradient(90deg, #ffd6f5, #c9a7ff, #9ecbff, #ffd6f5);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
    text-align: center;
    margin-bottom: 25px;
    line-height: 1.3;
  }

  .greeting {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.05rem, 2.8vw, 1.3rem);
    line-height: 1.85;
    color: #f0e6ff;
    letter-spacing: .3px;
  }

  .line { display: block; margin-bottom: 14px; }
  .line.blank { height: 6px; margin-bottom: 6px; }
  .line.quote { font-style: italic; color: #ffd6f5; text-align: center; font-size: 1.1em; padding: 4px 0; }
  .line.highlight { color: #ffb8dc; font-weight: 600; }
  .line.center { text-align: center; }
  .line.en { font-family: 'Cormorant Garamond', serif; font-style: italic; color: #d8c4ff; text-align: center; }
  .line.divider { text-align: center; color: #c9a7ff; font-size: 1.2em; margin: 18px 0; letter-spacing: 8px; }
  .line.signature { text-align: right; font-family: 'Great Vibes', cursive; font-size: 1.5em; color: #ffd6f5; margin-top: 20px; line-height: 1.4; }

  .cursor {
    display: inline-block;
    width: 2px;
    background: #ff9ecb;
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
    vertical-align: text-bottom;
    height: 1.2em;
    box-shadow: 0 0 8px #ff9ecb;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* EFEK */
  .confetti {
    position: absolute;
    width: 10px; height: 16px;
    animation: fall linear forwards;
    will-change: transform;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(900deg); opacity: 0; }
  }

  .balloon {
    position: absolute;
    bottom: -160px;
    width: 54px; height: 66px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: rise linear forwards;
    opacity: .92;
    will-change: transform;
  }
  .balloon::after {
    content: '';
    position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 9px;
    background: rgba(255,255,255,.7);
    border-radius: 0 0 3px 3px;
  }
  .balloon::before {
    content: '';
    position: absolute; bottom: -50px; left: 50%;
    width: 1px; height: 50px;
    background: rgba(255,255,255,.4);
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: .92; }
    100% { transform: translateY(-130vh) translateX(40px) rotate(20deg); opacity: 0; }
  }

  .heartfloat {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    animation: floatHeart linear forwards;
    will-change: transform;
  }
  @keyframes floatHeart {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-115vh) scale(1.3) rotate(25deg); opacity: 0; }
  }

  .petal {
    position: absolute;
    top: -40px;
    font-size: 20px;
    animation: petalFall linear forwards;
    will-change: transform;
  }
  @keyframes petalFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(115vh) rotate(720deg); opacity: 0; }
  }

  .spark {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    pointer-events: none;
    animation: sparkOut 1.2s ease-out forwards;
  }
  @keyframes sparkOut {
    0% { transform: translate(0,0) scale(1.4); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  }

  .sparkle {
    position: absolute;
    color: #fff;
    font-size: 18px;
    pointer-events: none;
    animation: sparkleOut 1.4s ease-out forwards;
    text-shadow: 0 0 8px #fff, 0 0 14px #ffd6f5;
  }
  @keyframes sparkleOut {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    30% { transform: scale(1.4) rotate(90deg); opacity: 1; }
    100% { transform: scale(0) rotate(180deg); opacity: 0; }
  }

  .music-btn {
    position: fixed; top: 18px; right: 18px;
    width: 46px; height: 46px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(8px);
    color: #fff; font-size: 1.2rem;
    z-index: 100;
    transition: all .3s;
    box-shadow: 0 0 20px rgba(255,158,203,.4);
  }
  .music-btn:hover { background: rgba(255,255,255,.3); transform: scale(1.1); }
  .music-btn.playing { animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .scroll-btn {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(8px);
    color: #fff; font-size: 1.3rem;
    z-index: 99;
    transition: all .3s;
    box-shadow: 0 0 20px rgba(255,158,203,.4);
    opacity: 0;
    pointer-events: none;
  }
  .scroll-btn.show { opacity: 1; pointer-events: auto; animation: bounceDown 2s infinite; }
  .scroll-btn:hover { background: rgba(255,255,255,.35); transform: translateX(-50%) scale(1.1); }
  @keyframes bounceDown {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(8px); }
  }

    /* Tombol balas WhatsApp */
  .wa-wrap {
    text-align: center;
    margin-top: 35px;
    padding-top: 25px;
    border-top: 1px dashed rgba(255,255,255,.15);
  }
  .wa-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(37, 211, 102, .45), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .3s, box-shadow .3s, opacity .5s;
    opacity: 0;
    transform: translateY(20px) scale(.9);
  }
  .wa-btn.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    animation: waPulse 2s infinite;
  }
  .wa-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 32px rgba(37, 211, 102, .65), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .wa-btn:active { transform: scale(.97); }
  .wa-btn svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }

  @keyframes waPulse {
    0%,100% { box-shadow: 0 6px 24px rgba(37, 211, 102, .45), 0 0 0 0 rgba(37, 211, 102, .5); }
    50% { box-shadow: 0 6px 24px rgba(37, 211, 102, .45), 0 0 0 14px rgba(37, 211, 102, 0); }
  }

  @media (max-width: 480px) {
    .cake { transform: scale(.85); }
    .message-box { padding: 28px 18px; border-radius: 18px; }
    .balloon { width: 42px; height: 52px; }
    .wa-btn { font-size: .92rem; padding: 12px 22px; }
  }
</style>
</head>
<body>

<div id="fxLayer"></div>

<button class="music-btn" id="musicBtn" title="Musik">🎵</button>
<button class="scroll-btn" id="scrollBtn" title="Ke bawah">⌄</button>

<!-- 🎵 AUDIO MP3 -->
<audio id="bgMusic" loop preload="auto">
  <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h1 class="title">Happy Birthday</h1>
  <p class="subtitle">For Tiara Gayatri</p>

  <div class="cake-wrap" id="cakeWrap">
    <div class="cake">
      <div class="layer layer1"><div class="drip"></div></div>
      <div class="layer layer2"><div class="drip"></div></div>
      <div class="layer layer3"><div class="drip"></div></div>
      <div class="glow" id="glow"></div>
      <div class="candle">
        <div class="wick"></div>
        <div class="flame" id="flame"></div>
      </div>
    </div>
    <div class="plate"></div>
  </div>

  <p class="hint" id="hint">✨ Klik kuenya untuk tiup lilin ✨</p>

  <div class="message-box" id="messageBox">
    <h2>✦ Happy Birthday, Tiara Gayatri ✦</h2>
    <div class="greeting" id="greeting"></div>

    <div class="wa-wrap">
      <a class="wa-btn" id="waBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Balas ke Aku
      </a>
    </div>
  </div>
</div>

<script>
/* ============================================================
   🔧 PENGATURAN — GANTI DI SINI
   ============================================================ */

// Nomor WhatsApp kamu (format 62xxx, tanpa + dan tanpa 0 di depan)
const NOMOR_WA = "6285735705825";

// Pesan otomatis yang muncul di chat WhatsApp
const PESAN_BALAS = "Makasih sayang ucapannya 🤍";

  /* ============================================================
   TEKS UCAPAN — untuk TIARA GAYATRI
   ============================================================ */
const greetingLines = [
  { text: "To someone who means more than she probably realizes,", class: "en" },
  { text: "happy birthday, Tiara Gayatri. 🤍", class: "highlight" },
  { text: "", class: "blank" },
  { text: "Hari ini adalah hari spesial kamu. Hari di mana satu tahun lagi perjalanan hidupmu dimulai.", class: "" },
  { text: "", class: "blank" },
  { text: "Tapi jujur, ada satu hal yang membuat ulang tahunmu kali ini terasa sedikit berbeda. Aku tahu sekarang kamu sedang berada di masa yang nggak mudah. Setelah kecelakaan itu, kaki kamu harus melewati proses penyembuhan, dan mungkin ada rasa sakit, rasa takut, bahkan rasa bosan yang kadang datang tanpa diundang.", class: "" },
  { text: "", class: "blank" },
  { text: "Dan sebagai seseorang yang peduli sama kamu, aku cuma bisa bilang...", class: "" },
  { text: "", class: "blank" },
  { text: "please take your time, Tiara.", class: "en" },
  { text: "You don't have to rush your healing. 🤍", class: "en" },
  { text: "", class: "blank" },
  { text: "Aku tahu mungkin aku nggak bisa menghilangkan rasa sakit yang kamu rasakan. Aku juga mungkin nggak selalu tahu harus melakukan apa supaya keadaan jadi lebih baik.", class: "" },
  { text: "", class: "blank" },
  { text: "Tapi setidaknya, aku ingin kamu tahu kalau aku selalu mendoakan kamu.", class: "highlight" },
  { text: "", class: "blank" },
  { text: "Semoga setiap harinya rasa sakit itu semakin berkurang.", class: "center" },
  { text: "Semoga proses penyembuhanmu berjalan dengan lancar.", class: "center" },
  { text: "Semoga kamu diberikan kesabaran ketika harus beristirahat lebih lama.", class: "center" },
  { text: "Dan semoga kamu segera bisa kembali melakukan hal-hal yang kamu suka.", class: "center" },
  { text: "", class: "blank" },
  { text: "I really hope you get better soon.", class: "en" },
  { text: "", class: "blank" },
  { text: "Karena jujur, aku ingin melihat kamu kembali seperti biasanya.", class: "" },
  { text: "", class: "blank" },
  { text: "Kembali bisa berjalan tanpa rasa khawatir.", class: "center" },
  { text: "Kembali bisa beraktivitas dengan bebas.", class: "center" },
  { text: "Kembali tertawa karena hal-hal kecil.", class: "center" },
  { text: "Dan tentunya, kembali menjadi Tiara yang aku kenal.", class: "center" },
  { text: "", class: "blank" },
  { text: "Mungkin aku nggak selalu pandai mengungkapkan rasa peduli secara langsung. Kadang mungkin aku terlihat biasa saja, kadang juga bingung harus berkata apa.", class: "" },
  { text: "", class: "blank" },
  { text: "Tapi percayalah, I do care about you. More than I sometimes know how to say.", class: "en" },
  { text: "", class: "blank" },
  { text: "Makanya di hari ulang tahunmu ini, selain mengucapkan selamat ulang tahun, aku juga ingin menitipkan satu doa:", class: "" },
  { text: "", class: "blank" },
  { text: "Semoga kamu cepat sembuh.", class: "center" },
  { text: "Semoga kamu selalu dikelilingi orang-orang yang menyayangimu.", class: "center" },
  { text: "Semoga kamu selalu diberikan kesehatan.", class: "center" },
  { text: "Dan semoga ke depannya hidup memperlakukanmu dengan lebih lembut.", class: "center" },
  { text: "", class: "blank" },
  { text: "Untuk umur yang baru ini, aku berharap kamu mendapatkan banyak hal baik.", class: "" },
  { text: "", class: "blank" },

/* ============================================================
   Suara tiupan lilin
   ============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBlowSound() {
  if (!audioCtx) initAudio();
  const bufferSize = audioCtx.sampleRate * 0.9;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const nGain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 900;
  nGain.gain.setValueAtTime(0.45, audioCtx.currentTime);
  nGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);
  noise.connect(filter);
  filter.connect(nGain);
  nGain.connect(audioCtx.destination);
  noise.start();
}

/* ============================================================
   TYPEWRITER + AUTO SCROLL
   ============================================================ */
const messageBox = document.getElementById('messageBox');
const greetingEl = document.getElementById('greeting');
const scrollBtn = document.getElementById('scrollBtn');
let typingStarted = false;
let userScrolled = false;

let scrollTimeout;
window.addEventListener('wheel', () => { userScrolled = true; clearTimeout(scrollTimeout); scrollTimeout = setTimeout(() => userScrolled = false, 3000); }, { passive: true });
window.addEventListener('touchmove', () => { userScrolled = true; clearTimeout(scrollTimeout); scrollTimeout = setTimeout(() => userScrolled = false, 3000); }, { passive: true });

function smoothScrollTo(y) {
  window.scrollTo({ top: y, behavior: 'smooth' });
}

function keepCursorVisible() {
  if (userScrolled) return;
  const cursor = greetingEl.querySelector('.cursor') || greetingEl.lastElementChild;
  if (!cursor) return;
  const rect = cursor.getBoundingClientRect();
  const viewportH = window.innerHeight;
  if (rect.bottom > viewportH * 0.75 || rect.top < viewportH * 0.2) {
    const cursorY = window.scrollY + rect.top;
    smoothScrollTo(cursorY - viewportH * 0.5);
  }
}

function typeAll() {
  if (typingStarted) return;
  typingStarted = true;

  setTimeout(() => {
    smoothScrollTo(messageBox.offsetTop - 80);
  }, 300);

  let lineIndex = 0;

  function typeLine() {
    if (lineIndex >= greetingLines.length) {
      const cur = greetingEl.querySelector('.cursor');
      if (cur) cur.remove();
      scrollBtn.classList.add('show');
      showWaButton();
      return;
    }
    const lineData = greetingLines[lineIndex];
    const lineEl = document.createElement('span');
    lineEl.className = 'line ' + (lineData.class || '');
    greetingEl.appendChild(lineEl);

    if (lineData.text === '') {
      lineIndex++;
      setTimeout(typeLine, 120);
      return;
    }

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    lineEl.appendChild(cursor);

    let charIndex = 0;
    const text = lineData.text;

    function typeChar() {
      if (charIndex < text.length) {
        const ch = text.charAt(charIndex);
        cursor.insertAdjacentText('beforebegin', ch);
        charIndex++;

        let delay = 20 + Math.random() * 22;
        if (ch === '.' || ch === ',' || ch === '!' || ch === '?') delay += 160;
        if (ch === ' ') delay = 14;
        if (/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(ch)) delay = 45;

        if (charIndex % 5 === 0) keepCursorVisible();
        setTimeout(typeChar, delay);
      } else {
        cursor.remove();
        lineIndex++;
        const isBlank = greetingLines[lineIndex] && greetingLines[lineIndex].text === '';
        keepCursorVisible();
        setTimeout(typeLine, isBlank ? 100 : 400);
      }
    }
    typeChar();
  }
  typeLine();
}

scrollBtn.addEventListener('click', () => {
  const cursor = greetingEl.querySelector('.cursor') || greetingEl.lastElementChild;
  if (cursor) {
    const rect = cursor.getBoundingClientRect();
    const cursorY = window.scrollY + rect.top;
    smoothScrollTo(cursorY - window.innerHeight * 0.5);
  } else {
    smoothScrollTo(document.body.scrollHeight);
  }
});
